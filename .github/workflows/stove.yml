# Builds OpenBench on the Team's self-hosted runner, which has the os32
# stove (m68k-amigaos-gcc and NDK 3.2; the NDK is never in this repository),
# and runs the host tests on GitHub's own runner. The compiler's messages
# show on the pull request as annotations; the build is the run's artifact.
#
# This repository is public, so the self-hosted job runs only for pushes
# and for pull requests from branches of this repository, never for a
# fork's: a fork's code never runs on the Team's machine.
# The stove is $OS32_STOVE on the runner, else ~/AmigaChrome/stoves/os32.
# MIT, Copyright (c) 2026 Dalsin Limited.
name: Build on the stove
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  os3:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          export STOVE="${OS32_STOVE:-$HOME/AmigaChrome/stoves/os32}"
          if [ ! -x "$STOVE/prefix/bin/m68k-amigaos-gcc" ]; then
            echo "::error::No os32 stove at $STOVE (set OS32_STOVE on the runner)"
            exit 1
          fi
          mkdir -p build/os3
          status=0
          sh build.sh build/os3 > build/step.log 2>&1 || status=1
          cat build/step.log
          # each compiler message as an annotation on its line (none is fine)
          { grep -E '^[^ :]+:[0-9]+:[0-9]+: (fatal error|error|warning|note):' build/step.log || true; } | while IFS= read -r l; do
            f=${l%%:*}; rest=${l#*:}; line=${rest%%:*}; rest=${rest#*:}; col=${rest%%:*}; rest=${rest#*: }
            kind=${rest%%:*}; msg=${rest#*: }
            f=${f#"$GITHUB_WORKSPACE/"}
            case "$kind" in *error) level=error ;; warning) level=warning ;; *) level=notice ;; esac
            echo "::$level file=$f,line=$line,col=$col::$msg"
          done
          if [ "$status" = 1 ]; then
            tail -n 40 build/step.log | sed "s#$GITHUB_WORKSPACE/##g" | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}' > build/tail.txt
            echo "::error title=build.sh failed::$(cat build/tail.txt)"
          else
            echo "::notice title=build.sh built::$(tail -n 1 build/step.log | sed "s#$GITHUB_WORKSPACE/##g")"
          fi
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: os3
          path: build/os3
          if-no-files-found: ignore
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Host tests
        run: sh tests/host/run.sh
